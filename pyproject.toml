[project]
name = "symbinterview"
version = "0.1.0"
description = "Symbolic Machine Learning vs Deep Learning framework"
authors = [
    {name = "Matthew Grant"}
]
readme = "README.md"
requires-python = "^3.10"
dependencies = [
    "jupyterlab (>=4.4.9,<5.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "numpy (>=2.3.3,<3.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "ipywidgets (>=8.1.7,<9.0.0)",
    "sympy (>=1.14.0,<2.0.0)",
    "pysr (>=1.5.9,<2.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "seaborn (>=0.13.2,<0.14.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
